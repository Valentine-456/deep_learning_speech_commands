model:
  type: transformer
  input_size: 40        # n_mfcc
  d_model: 128
  num_heads: 4
  num_layers: 2
  dim_feedforward: 256
  dropout: 0.1

data:
  cache_dir: data/cache
  feature: mfcc         # mel | mfcc
  augmentation: true

training:
  epochs: 40
  batch_size: 64
  lr: 0.0003
  workers: 4
  seed: 42
  early_stopping_patience: 7
  out_dir: results
